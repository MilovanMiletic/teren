# Local development dependencies for Teren.
# The API and PWA run on the host (dotnet run / ng serve); this file provides
# only the backing services, so the edit-reload loop stays fast.
#
#   docker compose up -d
#   docker compose down          (keeps data)
#   docker compose down -v       (wipes data)

services:
  postgres:
    image: postgres:17-alpine
    container_name: teren-postgres
    environment:
      POSTGRES_DB: teren
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: teren_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren -d teren"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Mirrors Hetzner Object Storage in production,
  # so the application code is identical in both places.
  minio:
    image: minio/minio:latest
    container_name: teren-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teren
      MINIO_ROOT_PASSWORD: teren_dev_only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console — http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket so the app never has to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 teren teren_dev_only &&
      mc mb --ignore-existing local/teren-media &&
      echo 'bucket teren-media ready'
      "

  # Mail catcher. Reports are emailed over SMTP (MailKit behind IReportDelivery), and this is
  # what makes that whole path provable on a laptop before any relay account exists: it accepts
  # every message and shows it, with its PDF attachment, at http://localhost:8025.
  #
  # Mailpit rather than MailHog: same idea, but Mailpit is actively maintained (MailHog has had
  # no release since 2020), it is MIT, it renders HTML and plain-text alternatives side by side —
  # which is exactly what needs checking on a report that a client reads on a phone — and it can
  # be told to require SMTP authentication, so the *authenticated relay* path this product will
  # actually run on in production is exercised locally too, not just anonymous localhost SMTP.
  #
  # PRODUCTION IS NOT THIS. Never send direct from the VPS: Hetzner blocks outbound port 25 by
  # default and a fresh VPS IP has no sending reputation, so the report that is the product would
  # land in the client's spam folder. Use an authenticated relay, and publish SPF, DKIM and DMARC
  # for the sending domain.
  mailpit:
    image: axllent/mailpit:latest
    container_name: teren-mailpit
    environment:
      # Accept whatever credentials are offered, over a plain connection: this is a laptop, and
      # requiring a real certificate here would only stop the thing under test from running.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # inbox — http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
