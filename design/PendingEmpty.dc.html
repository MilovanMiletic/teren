<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', Arial, sans-serif; color: #1A1A1A; background: #EFEDE8; -webkit-font-smoothing: antialiased; }
    a { color: #C2410C; } a:hover { color: #9A3412; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #EFEDE8; display: flex; flex-direction: column; overflow: hidden; padding: 0 16px;">

  <!-- App bar: back + title + count -->
  <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0 16px 0;">
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,26,0.04), 0 6px 20px rgba(26,26,26,0.05); display: flex; justify-content: center; align-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <span style="font-size: 22px; font-weight: 700; flex-grow: 1;">Čeka slanje</span>
    <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: #5F5B52; padding-right: 6px;">0</span>
  </div>

  <!-- Empty state -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; padding: 0 24px;">
    <div style="width: 84px; height: 84px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,26,0.04), 0 6px 20px rgba(26,26,26,0.05); display: flex; justify-content: center; align-items: center;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
    </div>
    <span style="font-size: 22px; font-weight: 700;">Sve je poslato</span>
    <span style="font-size: 15px; font-weight: 400; line-height: 1.5; color: #5F5B52; text-align: center;">Poslednji unos je primljen danas u 14:32. Svi snimci i fotografije su na serveru.</span>
  </div>

  <!-- Secondary: back to capture -->
  <div style="padding-bottom: 28px;">
    <div style="display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 56px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,26,0.04), 0 6px 20px rgba(26,26,26,0.05);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 18v4"></path></svg>
      <span style="font-size: 16px; font-weight: 600;">Novi unos</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
